name: P0 repository history and generated status gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install scanner and scan event commit range
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.24.3'
      - name: Scan all fetched history explicitly
        run: gitleaks detect --redact --exit-code=2 --log-opts=--all --report-format=sarif --report-path=results.full-history.sarif
      - name: Coverage note
        if: always()
        run: |
          echo 'The action scans the event range; the explicit full-history step requests --all. Inspect both step outcomes and scan logs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage is limited to fetched refs. A clean scan does not prove no secret was ever committed or removed from unavailable history.' >> "$GITHUB_STEP_SUMMARY"

  generated-status-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Regenerate from canonical capability register
        run: bun run status:write
      - name: Ensure checked-in status matches generated output
        run: git diff --exit-code -- docs/STATUS.md
