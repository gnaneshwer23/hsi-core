name: SME disposable PostgreSQL validation
on:
  pull_request:
    paths:
      - 'docs/architecture/sme-02b/**'
      - 'src/scientificMemory*.ts'
      - 'src/db/scientificMemory*.ts'
      - 'src/scientificMemoryGraphChannel.ts'
      - 'src/scientificMemoryCrossref*.ts'
      - 'src/scientificMemoryPublicationVersion.ts'
      - '.github/workflows/sme-postgres-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sme_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute disposable database integration fixture
        env:
          PGPASSWORD: fixture-only
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d sme_fixture -f docs/architecture/sme-02b/memory-runtime.fixture.sql

      - name: Execute multi-connection revision validation
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -v concurrency_setup=1 -h 127.0.0.1 -U postgres -d sme_fixture -f docs/architecture/sme-02b/memory-runtime.fixture.sql
          bash docs/architecture/sme-02b/memory-concurrency.fixture.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Execute provider-connected worker against disposable database
        env:
          SME_DISPOSABLE_FIXTURE: '1'
        run: bun --no-env-file docs/architecture/sme-02b/memory-worker-e2e.fixture.ts

      - name: Execute independent-connection delivery validation
        env:
          SME_DISPOSABLE_FIXTURE: '1'
        run: bun --no-env-file docs/architecture/sme-02b/memory-delivery-e2e.fixture.ts

      - name: Execute synthetic evidence ingestion validation
        env:
          SME_DISPOSABLE_FIXTURE: '1'
        run: bun --no-env-file docs/architecture/sme-02b/memory-evidence-e2e.fixture.ts

      - name: Execute synthetic adjudication persistence validation
        env:
          SME_DISPOSABLE_FIXTURE: '1'
        run: bun --no-env-file docs/architecture/sme-02b/memory-adjudication-e2e.fixture.ts
