name: SME public Crossref validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Validate public DOI metadata
        env:
          SME_PUBLIC_CROSSREF_PROBE: '1'
        run: bun --no-env-file docs/architecture/sme-02b/crossref-live-probe.ts
