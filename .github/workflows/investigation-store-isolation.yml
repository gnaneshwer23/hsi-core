name: Investigation store isolation (disposable PostgreSQL)
on:
  pull_request:
    paths:
      - 'db/migrations/034_*'
      - 'db/verify/034_*'
      - 'src/db/investigationStore.ts'
      - 'scripts/verify-investigation-store-local.ts'
      - '.github/workflows/investigation-store-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/034_*'
      - 'src/db/investigationStore.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: hsi_store_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the disposable database (synthetic users only)
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hsi_store_it -f db/verify/034_investigation_store_setup.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d hsi_store_it -c "ALTER ROLE hsi_graph_runtime PASSWORD 'fixture-only'; ALTER ROLE hsi_store_owner PASSWORD 'fixture-only';"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Two-account isolation suite
        env:
          HSI_LOCAL_PG_HOST: 127.0.0.1
          HSI_LOCAL_PG_DB: hsi_store_it
          PGPASSWORD: fixture-only
        run: bun --no-env-file scripts/verify-investigation-store-local.ts
