name: Research foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  site-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # Vercel installs from site; root dependencies must not mask missing API types.
      - run: bun install --frozen-lockfile
        working-directory: site
      - name: Build local site and API (does not deploy)
        run: bun run build
        working-directory: site
      - name: Check public benchmark artifacts after build
        run: bun --no-env-file scripts/immuno-benchmark.ts --check
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun audit --json
      - run: bun run check
      - name: Generate local engineering evidence (not live acceptance)
        run: bun --no-env-file run pilot:check --out /tmp/hsi-pilot-engineering-report.json
      - name: Retain local engineering evidence
        uses: actions/upload-artifact@v4
        with:
          name: pilot-engineering-evidence
          path: /tmp/hsi-pilot-engineering-report.json
          retention-days: 14
          if-no-files-found: error
      - run: bun run ra:test-parser
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bunx --no-install tsc -p site/tsconfig.json
      - run: bun audit --json
        working-directory: site
      - run: bun run site:build
      - name: Check public benchmark artifacts after build
        run: bun --no-env-file scripts/immuno-benchmark.ts --check
      - run: bunx --no-install playwright install chromium
        working-directory: site
      - name: Test local browser contracts (no live DB/provider acceptance)
        run: bun run test:e2e
        working-directory: site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-browser-qa
          path: |
            site/test-results/
            site/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
