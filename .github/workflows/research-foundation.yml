name: Research foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  site-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # Vercel installs from site; root dependencies must not mask missing API types.
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run build
        working-directory: site
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun audit --json
      - run: bun run check
      - run: bun --no-env-file run pilot:check --out /tmp/hsi-pilot-engineering-report.json
      - run: bun run ra:test-parser
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bunx --no-install tsc -p site/tsconfig.json
      - run: bun audit --json
        working-directory: site
      - run: bun run site:build
      - run: bunx --no-install playwright install --with-deps chromium
        working-directory: site
      - run: bun run test:e2e
        working-directory: site
